version: '3.8'

services:
  db:
    image: mongo:7
    volumes:
      - mongodata:/data/db
    restart: unless-stopped

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      MONGO_URL: mongodb://db:27017/taskdb
      PORT: 3000
    depends_on:
      - db
    restart: unless-stopped

volumes:
  mongodata:
